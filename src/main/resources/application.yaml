spring:
  application:
    name: 1hosun
  threads:
    virtual:
      enabled: true           # AI 분석 대기(폴링)가 @Async 스레드를 오래 잡아서, 기본 풀(8개) 대신 가상 스레드 사용
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB     # 첨부파일 1개 최대 (명세 가정값)
      max-request-size: 55MB  # 파일 5개 + JSON

file:
  storage:
    type: local               # GCP Cloud Storage 연동 시 gcs로 변경
    local:
      base-dir: ./uploads
      url-prefix: /files

ai:
  client: ${AI_CLIENT:stub}   # stub = 더미 응답 / http = FastAPI AI 서버 호출(HttpAiClient)
  http:
    base-url: ${AI_HTTP_BASE_URL:http://localhost:8000}   # FastAPI 서버 주소
    api-key: ${AI_HTTP_API_KEY:}      # X-API-Key 헤더. 저장소에 커밋하지 말 것 (환경변수로만)
    connect-timeout: 5s
    read-timeout: 30s                 # 분석 제출·상태 조회·결과 조회·3-5 비율 계산
    reference-draft-read-timeout: 150s  # 2-1 AI 작성 글 생성은 동기로 수십 초 (AI 담당 권장 120s 이상)
    poll-interval: 2s                 # 분석 상태(4-1) 조회 간격
    poll-timeout: 15m                 # 분석 1건 최대 대기. AI 서버는 순차 처리(1건 30~40초, 대기열 최대 20건)
