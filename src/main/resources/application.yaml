spring:
  application:
    name: 1hosun
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB     # 첨부파일 1개 최대 (명세 가정값)
      max-request-size: 55MB  # 파일 5개 + JSON

file:
  storage:
    type: local               # GCP Cloud Storage 연동 시 gcs로 변경
    local:
      base-dir: ./uploads
      url-prefix: /files

ai:
  client: stub                # stub = 더미 응답 / http = FastAPI AI 서버 호출(HttpAiClient)
  http:
    base-url: http://localhost:8000   # FastAPI 서버 주소 (배포 시 환경변수 AI_HTTP_BASE_URL로 덮어쓰기)
    connect-timeout: 5s
    read-timeout: 120s                # LLM 응답 대기 최대 시간. 넘으면 FAILED
    reference-draft-path: /api/v1/reference-drafts
    comparison-path: /api/v1/comparisons
